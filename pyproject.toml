[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "redline-serving"
dynamic = ["version"]
description = "Faster block-diffusion serving with distribution-free risk guarantees"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jungseob Lee" }]
keywords = ["block-diffusion", "risk-control", "llm-serving", "multiple-testing", "speculative-decoding"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Redline needs only numpy and scipy, so `import redline` works on any laptop.
# Matplotlib is used only by the optional --plot of two experiment scripts.
dependencies = ["numpy>=1.23", "scipy>=1.10"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
test = ["pytest>=8"]

[project.scripts]
redline = "redline.cli:main"

[project.urls]
Homepage = "https://github.com/js-lee-AI/Redline"
Issues = "https://github.com/js-lee-AI/Redline/issues"

[tool.setuptools.dynamic]
version = { attr = "redline.__version__" }

[tool.setuptools.packages.find]
include = ["redline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
